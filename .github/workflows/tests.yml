name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11.*', '12.*', '13.*']
        include:
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
        exclude:
          - php: '8.2'
            laravel: '13.*'
          # Laravel 11 is past its support window and was never released for PHP 8.5
          - php: '8.5'
            laravel: '11.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          extensions: dom, mbstring, gd, pdo_sqlite
          coverage: none

      # Every Laravel 11 release has published advisories (it is past security support); allow it for the test run only
      - name: Allow Laravel 11
        if: matrix.laravel == '11.*'
        run: composer config audit.block-insecure false

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  # Code style (Pint) and static analysis (Larastan), once on the newest stack
  quality:
    runs-on: ubuntu-latest
    name: Pint / Larastan

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          extensions: dom, mbstring, gd, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Code style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
